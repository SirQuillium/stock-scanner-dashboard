<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuillRunner</title>
    
    <meta property="og:title" content="QuillRunner" />
    <meta property="og:description" content="Quills moving average watch list" />
    <meta property="og:image" content="https://SirQuillium.github.io/stock-scanner-dashboard/quill.jpg" />
    
    <link rel="icon" type="image/jpeg" href="quill.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #050505;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            background-image: linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            position: relative;
            z-index: 100;
            background: #050505;
        }
        .header h1 {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            margin-top: 5px;
            font-size: 2em;
        }
        .logo-glitch {
            height: 60px; width: 60px;
            border-radius: 50%;
            border: 2px solid #0ff;
            box-shadow: 0 0 15px #0ff;
            object-fit: cover;
        }
        .nav-link-grid {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0ff;
            text-decoration: none;
            border: 1px solid #0ff;
            padding: 8px 15px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .nav-link-grid:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 10px #0ff;
        }
        .cyber-select {
            background: rgba(0,20,20,0.8);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 5px 10px;
            border-radius: 4px;
            outline: none;
        }
        
        /* Sorting Headers */
        .sorting-row {
            width: 100%;
            background: rgba(0, 15, 15, 0.9);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding: 10px 0;
            z-index: 90;
        }
        .sorting-container {
            width: 90%;
            padding: 0 20px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }
        .sort-header {
            flex: 1 1 0;
            min-width: 0;
            margin: 0 6px;
            text-align: center;
            color: #0ff;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            padding-bottom: 5px;
        }
        .sort-header:first-child { margin-left: 0; }
        .sort-header:hover {
            color: #fff;
            text-shadow: 0 0 8px #fff;
        }
        .sort-header.active {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px #0ff;
            border-bottom: 2px solid #0ff;
        }
        
        /* Cyber Scrollbar */
        .cyber-scrollbar {
            position: absolute;
            right: 15px;
            top: 25%;
            height: 50%;
            width: 12px;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            z-index: 9999;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .cyber-scrollbar:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .cyber-thumb {
            width: 100%;
            background: #0ff;
            border-radius: 6px;
            box-shadow: 0 0 10px #0ff;
            position: absolute;
            top: 0;
            transition: top 0.05s ease-out;
            cursor: grab;
        }
        .cyber-thumb:active {
            cursor: grabbing;
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 20, 20, 0.9);
            border: 2px solid #0ff;
            color: #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            padding: 10px 18px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.9em;
            letter-spacing: 2px;
            cursor: pointer;
            z-index: 10000;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s, box-shadow 0.2s;
            pointer-events: none;
        }
        .scroll-top-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .scroll-top-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 25px #0ff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #050505; color: #fff; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; }
        
        /* Mobile Breakpoint */
        @media (max-width: 1000px) {
            body { overflow-y: auto !important; height: auto !important; display: block !important; }
            .scene { height: auto !important; perspective: none !important; align-items: stretch !important; display: block !important; overflow: visible !important; padding-top: 20px !important; }
            .scene::before, .scene::after { display: none !important; }
            .drum { position: relative !important; top: 0 !important; left: 0 !important; transform: none !important; margin: 0 auto !important; width: 95% !important; height: auto !important; }
            .cyber-card { position: relative !important; transform: none !important; margin-bottom: 20px !important; opacity: 1 !important; pointer-events: auto !important; width: 100% !important; height: auto !important; min-height: auto !important; padding: 15px !important; left: 0 !important; top: auto !important; display: block !important; }
            .sorting-row { display: block !important; overflow-x: auto !important; white-space: nowrap !important; -webkit-overflow-scrolling: touch !important; padding-bottom: 5px !important; }
            .sorting-container { width: max-content !important; padding: 0 15px !important; }
            .sort-header { padding: 8px 15px !important; font-size: 0.9em !important; border-bottom: 2px solid transparent !important; flex: none !important; margin: 0 4px !important; }
            .cyber-scrollbar { display: none !important; }
            .metric-row { flex-wrap: wrap !important; gap: 10px !important; margin-top: 15px !important; }
            .metric { flex: 1 1 45% !important; margin: 0 !important; padding: 10px !important; }
            .action-buttons { width: 100% !important; margin-left: 0 !important; justify-content: space-between !important; margin-top: 10px !important; }
            .action-buttons .neo-btn { flex: 1 !important; }
        }
        
        /* Tooltip */
        .cyber-tooltip {
            position: fixed;
            top: 0; left: 0;
            background: rgba(0, 15, 15, 0.95);
            border: 1px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            border-left: 4px solid #0ff;
            border-radius: 4px;
            padding: 15px;
            width: 350px;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            color: #ccc;
        }
        .tooltip-title {
            color: #0ff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1.1em;
            margin-bottom: 5px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .tooltip-desc { font-size: 0.9em; margin-bottom: 8px; line-height: 1.4; }
        .tooltip-example { font-size: 0.85em; color: #ffb800; font-style: italic; }

        /* 3D Scene */
        .scene {
            width: 100%;
            height: 80vh;
            perspective: 4000px;
            perspective-origin: 50% 100px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            overflow: hidden;
            position: relative;
        }
        .scene::before, .scene::after {
            content: "";
            position: absolute;
            left: 0; right: 0; height: 35%;
            z-index: 50;
            pointer-events: none;
        }
        .scene::before { top: 0; background: linear-gradient(to bottom, rgba(5,5,5,1) 0%, rgba(5,5,5,0) 100%); }
        .scene::after { bottom: 0; background: linear-gradient(to top, rgba(5,5,5,1) 0%, rgba(5,5,5,0) 100%); }
        
        .drum {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }
        
        .cyber-card {
            position: absolute;
            width: 90%;
            left: 5%;
            top: 20px;
            height: 185px;
            background: rgba(0, 15, 15, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-left: 5px solid #0ff;
            border-radius: 8px;
            padding: 14px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            transition: border-color 0.3s, box-shadow 0.3s, opacity 0.2s;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .cyber-card:hover {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            border-color: #0ff;
            z-index: 60;
        }
        .cyber-card.macro {
            border-left-color: #ffb800;
            background: rgba(20, 15, 0, 0.7);
        }
        .cyber-card.macro:hover {
            box-shadow: 0 0 30px rgba(255, 184, 0, 0.6);
            border-color: #ffb800;
        }
        
        .ticker-symbol {
            font-size: 2.3em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px #fff;
            text-decoration: none;
        }
        .ticker-symbol:hover { color: #0ff; }
        .price {
            font-size: 2.1em;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .metric {
            flex: 1 1 0;
            min-width: 0;
            margin: 0 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #333;
            font-size: 1.15em;
            text-align: center;
            transition: all 0.2s;
            cursor: crosshair;
        }
        .metric:first-child { margin-left: 0; }
        .metric:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: #0ff;
        }
        .metric span.label {
            color: #888;
            display: block;
            text-transform: uppercase;
            font-size: 0.65em;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-left: 8px;
            width: 240px;
            justify-content: flex-end;
            align-items: center;
        }
        
        .neo-btn {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 8px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.85em;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            text-align: center;
            display: inline-block;
        }
        .neo-btn:hover { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 10px #0ff; }
        .neo-btn.danger { background: rgba(255, 184, 0, 0.05); border-color: #ffb800; color: #ffb800; }
        .neo-btn.danger:hover { background: rgba(255, 184, 0, 0.2); box-shadow: 0 0 10px #ffb800; }
        .neo-btn.clicked { 
            background: rgba(0, 255, 0, 0.1); 
            border-color: #0f0; 
            color: #0f0; 
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5); 
        }
    </style>
</head>

    <div class="header">
        <a href="index.html" class="nav-link-grid">Grid View</a>

        <h1>QUILLRUNNER</h1>

            <div class="sort-header" data-sort="Short (%)" onclick="sortData('Short (%)')">SHORT %</div>
            <div style="width: 248px;"></div>

    <div class="cyber-scrollbar">
        <div class="cyber-thumb" id="scrollThumb"></div>

    <button id="scrollTopBtn" class="scroll-top-btn" onclick="scrollToTop()">▲ TOP</button>

        <div id="tooltipDesc" class="tooltip-desc"></div>
        <div id="tooltipExample" class="tooltip-example"></div>
    </div>

    <div class="scene" id="scene">
        <div class="drum" id="drum"></div>
    </div>

        function handleScrollbarAction(e) {
            const rect = scrollbarElem.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            let progress = clickY / rect.height;
            progress = Math.max(0, Math.min(1, progress));
            drumAngle = progress * maxAngle;
            updateDrum();
        }

        if (scrollbarElem) {
            scrollbarElem.addEventListener('mousedown', (e) => {
                isDraggingScrollbar = true;
                document.getElementById('drum').style.transition = 'none';
                handleScrollbarAction(e);
                e.preventDefault();
            });
        }

        window.addEventListener('mousemove', (e) => {
            if (isDraggingScrollbar) {
                handleScrollbarAction(e);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingScrollbar) {
                isDraggingScrollbar = false;
                document.getElementById('drum').style.transition = 'transform 0.1s ease-out';
            }
        });

        // Mobile Scroll Listener for Top Button
        window.addEventListener('scroll', () => {
            if (window.innerWidth <= 1000) {
                const scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
                const topBtn = document.getElementById('scrollTopBtn');
                if (scrollTotal > 0 && topBtn) {
                    const progress = window.scrollY / scrollTotal;
                    if (progress >= 0.2) {
                        topBtn.classList.add('visible');
                    } else {
                        topBtn.classList.remove('visible');
                    }
                }
            }
        });

        document.addEventListener('wheel', (e) => {
            // Positive delta (scrolling down) increases drumAngle, bringing lower cards up
            drumAngle += e.deltaY * 0.015; 
            updateDrum();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') { drumAngle += theta; e.preventDefault(); }
            else if (e.key === 'ArrowUp') { drumAngle -= theta; e.preventDefault(); }
            else if (e.key === 'PageDown') { drumAngle += theta * 3; e.preventDefault(); }
            else if (e.key === 'PageUp') { drumAngle -= theta * 3; e.preventDefault(); }
            updateDrum();
        });

        $(document).ready(function() {
            const dateSelector = document.getElementById('dateSelector');
            const dates = Object.keys(dbData).sort((a, b) => new Date(b) - new Date(a));
            dates.forEach(date => {
                const opt = document.createElement('option');
                opt.value = date;
                opt.innerHTML = "SYS_DATE: " + date;
                dateSelector.appendChild(opt);
            });
            if (dates.length > 0) {
                buildCylinder(dates[0]);
            }
        });
    </script>
</body>
</html>
